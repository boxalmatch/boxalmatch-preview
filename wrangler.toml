# Cloudflare Pages configuration.
#
# Inert while the site is served by GitHub Pages — nothing here runs
# until the project is deployed through Cloudflare Pages, as described
# in MEMBERS-SETUP.md.

name = "boxalmatch"
pages_build_output_dir = "."
compatibility_date = "2026-01-01"

# The D1 and R2 bindings are deliberately NOT declared here.
#
# Two reasons. A binding in this file needs a real database_id, and a
# placeholder one fails the build — so committing it half-filled would
# break every deploy until someone edited the file. And when bindings
# are declared here, they take over from the ones set in the dashboard,
# which is where this project sets them (see SUBMISSIONS-SETUP.md).
#
# Set DB (D1) and MEDIA (R2) under
#   Workers & Pages -> boxalmatch -> Settings -> Bindings
#
# If you later switch to deploying with the wrangler CLI, move them
# here instead — but keep them in one place, not both.
